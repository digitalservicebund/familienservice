sonar.projectKey=digitalservicebund_familienservice
sonar.organization=digitalservicebund
sonar.exclusions=coverage/**,**/dist/**,**/.astro/**
# cms/config and cms/src/admin: Strapi config and admin examples from the generator, nothing to unit-test.
# cms/src/index.ts: excluded only until the CMS gets tests, remove it from the list then.
sonar.coverage.exclusions=**/tests/**,**/*.test.ts,**/*.config.*,**/*.d.ts,cms/config/**,cms/src/admin/**,cms/src/index.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info