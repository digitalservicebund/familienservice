# Local PostgreSQL for the Strapi CMS.
#
# Start it with `pnpm start:cms:db` (repository root). Docker Compose reads the
# DATABASE_* variables from cms/.env (see cms/.env.example); values already set
# in the environment take precedence.
name: familienservice-cms

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-familienservice_cms}
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is not set, see cms/.env.example}
    ports:
      # Only reachable from this machine
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
