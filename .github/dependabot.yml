version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      oxc:
        patterns:
          - "oxfmt"
          - "oxlint"
      # All @strapi/* packages must always have the same version
      strapi:
        patterns:
          - "@strapi/*"
    ignore:
      # Strapi majors need codemods and the migration guide: run
      # `pnpm --filter @familienservice/cms strapi:upgrade:major` instead (see cms/README.md).
      # The admin panel dependencies (React etc.) follow the versions Strapi supports.
      - dependency-name: "@strapi/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "styled-components"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    # One Dockerfile per package
    directories:
      - /web
      - /cms
    schedule:
      interval: daily
    cooldown:
      default-days: 1

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    groups:
      actions:
        patterns:
          - "actions/*"
      docker:
        patterns:
          - "docker/*"
